name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test server and scheduling policy
        run: |
          python -m pip install -r server/requirements.txt
          (cd server && python -m unittest -v test_app.py)
          g++ -Iinclude tests/firmware_policy.cpp -o firmware-policy-test
          ./firmware-policy-test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dingdingcheckin:latest
            ghcr.io/${{ github.repository_owner }}/dingdingcheckin:${{ github.sha }}
